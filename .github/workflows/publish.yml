name: Publish Post

on:
  repository_dispatch:
    types: [publish-post]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: draft → blog 이동
        run: |
          DRAFT_FILE="${{ github.event.client_payload.draft_file }}"
          FILENAME=$(basename "$DRAFT_FILE")
          mkdir -p src/content/blog
          cp "$DRAFT_FILE" "src/content/blog/$FILENAME"
          rm "$DRAFT_FILE"

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ drafts/
          git diff --cached --quiet || git commit -m "publish: $(basename ${{ github.event.client_payload.draft_file }} .md)"
          git push

      - name: Telegram — 발행 완료 알림
        if: success()
        run: |
          SLUG=$(basename "${{ github.event.client_payload.draft_file }}" .md)
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ 발행 완료: ${SLUG}
https://wjdghtls95.github.io/blog/${SLUG}/ (1~2분 후 반영)"

      - name: Telegram — 발행 실패 알림
        if: failure()
        run: |
          SLUG=$(basename "${{ github.event.client_payload.draft_file }}" .md)
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=❌ 발행 실패: ${SLUG}
GitHub Actions 로그 확인 필요"
