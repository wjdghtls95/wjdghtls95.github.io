name: Publish Post

on:
  repository_dispatch:
    types: [publish-post]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: draft → blog 이동
        run: |
          DRAFT_FILE="${{ github.event.client_payload.draft_file }}"
          FILENAME=$(basename "$DRAFT_FILE")
          mkdir -p src/content/blog
          cp "$DRAFT_FILE" "src/content/blog/$FILENAME"
          rm "$DRAFT_FILE"

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ drafts/
          git diff --cached --quiet || git commit -m "publish: $(basename ${{ github.event.client_payload.draft_file }} .md)"
          git push
