name: Publish Post

on:
  repository_dispatch:
    types: [publish-post]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: draft → blog 이동
        run: |
          DRAFT_FILE="${{ github.event.client_payload.draft_file }}"
          FILENAME=$(basename "$DRAFT_FILE")
          mkdir -p src/content/blog
          cp "$DRAFT_FILE" "src/content/blog/$FILENAME"
          rm "$DRAFT_FILE"

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ drafts/
          git diff --cached --quiet || git commit -m "publish: $(basename ${{ github.event.client_payload.draft_file }} .md)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Astro 빌드
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
        id: deployment
