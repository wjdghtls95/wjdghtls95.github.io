name: Quiz Pipeline

on:
  push:
    paths:
      - 'drafts/**'

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 새로 추가된 draft 파일 감지
        id: detect
        run: |
          CHANGED=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'drafts/*.md' 'drafts/*.mdx' | head -1)
          echo "file=$CHANGED" >> $GITHUB_OUTPUT

      - name: 퀴즈 생성 및 Telegram 전송
        if: steps.detect.outputs.file != ''
        env:
          # LLM 설정 — LLM_PROVIDER: anthropic (기본) | gemini | openai
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 사용하는 프로바이더의 키만 설정하면 됨
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Cloudflare
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          DRAFT_FILE: ${{ steps.detect.outputs.file }}
        run: |
          pip install openai anthropic google-genai requests
          python scripts/generate-quiz.py
