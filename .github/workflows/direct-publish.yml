name: Direct Publish

on:
  push:
    paths:
      - 'direct/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 새로 추가된 direct 파일 감지, 이동 및 삭제
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'direct/*.md' 'direct/*.mdx')
          for FILE in $CHANGED; do
            FILENAME=$(basename "$FILE")
            cp "$FILE" "src/content/blog/$FILENAME"
            git rm "$FILE"
          done

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git diff --cached --quiet || git commit -m "publish: direct post"
          git push
